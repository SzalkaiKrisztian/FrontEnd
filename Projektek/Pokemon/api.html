    <title>Pokemon Card Generator</title>
    <link rel="stylesheet" href="pokemon.css">
</head>
<body>
    
    <div class="container">
        <div id="card">
            <p id="hp"></p>
            <img id="img" src="" alt="" />
            <h2 id="poke-name"></h2>
            <div id="type"></div>
            <div id="stats">
                <div>
                    <h3 id="attack"></h3>
                    <p>Attack</p>
                </div>
                <div>
                    <h3 id="defense"></h3>
                    <p>Defense</p>
                </div>
                <div>
                    <h3 id="speed"></h3>
                    <p>Speed</p>
                </div>
            </div>
        </div>
        <button id="btn">Generate</button>
    </div>

    <script src="pokemon.js"></script>
